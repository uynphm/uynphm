name: 3d-contrib

on:
  schedule:
    - cron: "0 10 * * *" # ~3am Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { contributionCount contributionLevel date } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/contrib.json"

      - name: Draw graph
        run: python3 .github/scripts/gen3d.py "$RUNNER_TEMP/contrib.json" assets

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          git diff --cached --quiet || git commit -m "Update 3D contribution graph"
          git push
